#:schema ./aircraft-type-descriptions.schema.json

# What is true of an aircraft type wherever it flies, by type designator.
#
# The designators are short public identifiers, used as keys, as an airport's
# code is. Each row's facts come from the sources it names in `sources`; no
# list, table or description code of ICAO Doc 8643 is copied here, and Doc
# 8643 is not used as a source or as a check (au-casa#7, au-casa#10).
#
# A row is confirmed when `checked-against` names a type certificate data
# sheet: someone has read it for this row. Otherwise it is provisional.
# `checked-against` means the sheet was read, so do not add a source to it
# without reading it.
#
# A source not yet read says so in its notes, with what is still to find (a
# revision, a sheet's number, or the data sheet itself), and a row citing only
# such sources stays provisional until someone reads the actual sheet. The
# sources moved from au-casa whose notes say what is still to find were
# identified by public search rather than by opening the document (au-casa
# tasks 0003 and 0004); none of them has been read.
#
# Each section is in byte (ASCII) order of its keys: sources by id, rows by
# designator. A row's `source-notes` table goes directly under it. The build
# checks the order.
#
# The table grows when a type is needed, and in batches compiled from public
# sources (aircraft-type-descriptions#3). A designator not in it is not known,
# not refused.
#
# The schema (aircraft-type-descriptions.schema.json) says what each field
# holds. What it cannot say is checked when the crate is built (build.rs):
# every source a row names is listed under `sources`, `checked-against` and
# `source-notes` name only the row's own sources, and the order (above).

schema-version = 1

# --- Sources ----------------------------------------------------------------
#
# Each written once, and named by its id from each row it gives facts for.

# CASA's file of the aircraft on the Australian register, one line per
# aircraft. Nothing is copied from it. A row names it when every aircraft
# listed under the row's designator (the ICAOtypedesig column) has the row's
# number and kind of engines (engnum, Engtype: a turboshaft there is a
# turboprop here, a turbofan a jet, and a diesel or a rotary a piston); where
# even one differs, the row does not cite it and says so in its notes. Its
# airframe column says "Power Driven Aeroplane" or "Rotorcraft", not landplane
# or helicopter, so it supports a row's airframe only that far; it also says
# "Glider" or "Motor-Glider", which is where a self-launching glider's
# airframe can come from (JO 7360.1 files those as fixed-wing). The batches of
# #3 and #9 are chosen in its order (aircraft per designator). The file read
# is acrftreg.csv of 25 Oct 2026, downloaded from CASA in a browser that day
# (7,015,180 bytes, 16,708 aircraft, SHA-256
# a59515170f75bb273443c4de4c08294a69a7e9e4935a9a1809d316f99a1d94a9). Every
# row that names it was checked against that file, the first batch's included
# (they were compiled from the file of 24 Oct 2026, 7,014,340 bytes, SHA-256
# 850b2236ee380fdee91eeaff2903815e224dc5a8383635af773a4eed1c01bef5). CASA
# replaces the file as the register changes, so neither can be fetched again.
[sources.casa-aircraft-register]
title = "CASA, Australian civil aircraft register data file (acrftreg.csv)"
kind = "reference-article"
revision = "acrftreg.csv of 25 Oct 2026"
url = "https://www.casa.gov.au/aircraft/aircraft-registration/data-files-registered-aircraft"
notes = """
Civil Aviation Safety Authority, licensed under CC BY 4.0 \
(https://creativecommons.org/licenses/by/4.0/). Changed: nothing is copied; \
the row uses counts derived from the file, and names it only where every \
aircraft registered under the designator has the row's number and kind of \
engines. CASA replaces the file, so this one cannot be fetched again.
"""

