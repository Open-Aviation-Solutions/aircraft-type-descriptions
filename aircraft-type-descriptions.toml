#:schema ./aircraft-type-descriptions.schema.json

# What is true of an aircraft type wherever it flies, by type designator.
#
# The designators are short public identifiers, used as keys, as an airport's
# code is. Each row's facts come from the sources it names in `sources`; no
# list, table or description code of ICAO Doc 8643 is copied here, and Doc
# 8643 is not used as a source or as a check (au-casa#7, au-casa#10).
#
# A row is confirmed when `checked-against` names a type certificate data
# sheet: someone has read it for this row. Otherwise it is provisional.
# `checked-against` means the sheet was read, so do not add a source to it
# without reading it.
#
# A source not yet read says so in its notes, with what is still to find (a
# revision, a sheet's number, or the data sheet itself), and a row citing only
# such sources stays provisional until someone reads the actual sheet. The
# sources moved from au-casa whose notes say what is still to find were
# identified by public search rather than by opening the document (au-casa
# tasks 0003 and 0004); none of them has been read.
#
# Each section is in byte (ASCII) order of its keys: sources by id, rows by
# designator. A row's `source-notes` table goes directly under it. The build
# checks the order.
#
# The table grows when a type is needed, rather than trying to list every
# designator. A designator not in it is not known, not refused.
#
# The schema (aircraft-type-descriptions.schema.json) says what each field
# holds. What it cannot say is checked when the crate is built (build.rs):
# every source a row names is listed under `sources`, `checked-against` and
# `source-notes` name only the row's own sources, and the order (above).

schema-version = 1

# --- Sources ----------------------------------------------------------------
#
# Each written once, and named by its id from each row it gives facts for.

