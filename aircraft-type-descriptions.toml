# --- Designators --------------------------------------------------------------
#
# Undercarriage (tailwheel, retractable gear, floats, skis) is not part of a
# row: it varies between airframes of one type, so it is the consumer's to
# record per aircraft.

[designators.AS21]
models = "Schleicher ASK 21 Mi"
airframe = "glider"
engines = 1
engine-type = "piston"
sources = ["easa-A221"]
notes = """
The self-launching variant, not the plain, unpowered ASK 21: it has a \
retractable IAE R50-AA rotary engine (41 kW), hence one piston engine, not \
zero. The plain ASK 21 is not known to have a designator of its own; an \
unpowered glider without one is filed as GLID.

The engine count and type describe the real airframe: an aircraft logged \
under this designator is the motorglider, not the plain trainer. (A \
consumer that reads a glider by its airframe alone, as CASA's Part 61 \
category does, is not affected either way.)
"""

[designators.AS21.source-notes]
easa-A221 = """
Not yet confirmed whether this sheet covers the self-launching Mi variant \
directly, or the airframe is certified through a supplemental or POA on the \
base ASK 21's own sheet.
"""

[designators.BL8]
models = "American Champion 8GCBC Scout"
airframe = "landplane"
engines = 1
engine-type = "piston"
sources = ["faa-8GCBC"]
notes = """
Not the same designator as the Citabria (CH7A, CH7B) despite sharing a \
manufacturer lineage: the Scout has a designator of its own.
"""

[designators.C152]
models = "Cessna 152"
airframe = "landplane"
engines = 1
engine-type = "piston"
sources = ["faa-3A19"]
notes = """
Lycoming O-235. Shares TCDS 3A19 with the Cessna 150. Still provisional: the \
sheet was identified by public search, not read.
"""

[designators.C172]
models = "Cessna 172 Skyhawk"
airframe = "landplane"
engines = 1
engine-type = "piston"
sources = ["faa-3A12"]
checked-against = ["faa-3A12"]
notes = """
TCDS 3A12 I: Continental O-300-A/-B; later models list Lycoming \
O-320/O-360/IO-360. One reciprocating engine throughout the series, 172 \
through 172S. Float variants are approved (172A onward are "PCL-SM"), which \
is per airframe, and so not part of the row.
"""

[designators.C208]
models = "Cessna 208 Caravan"
airframe = "landplane"
engines = 1
engine-type = "turboprop"
sources = ["faa-A37CE"]
checked-against = ["faa-A37CE"]
notes = """
TCDS A37CE I: one Pratt & Whitney Canada PT6A-114 or PT6A-114A Turbo Prop. \
Approved as both landplane ("11 PCLM") and seaplane ("11 PCSM"); floats are \
per airframe, and so not part of the row.
"""

[designators.CH7A]
models = "Citabria 7ECA series; Aeronca 7AC Champion"
airframe = "landplane"
engines = 1
engine-type = "piston"
sources = ["faa-A-759"]
checked-against = ["faa-A-759"]
notes = """
TCDS A-759 XVIII: Continental O-200-A, one reciprocating engine.

The Citabria is split across two designators, this and CH7B, so a logbook \
row reading only "Citabria" is ambiguous between them; the model number \
decides. CH7A also covers the Aeronca 7AC Champion, a different aeroplane \
sharing the designator (TCDS A-759 I: Continental A-65-8).

Neither ambiguity changes the description: every model under both \
designators is a single-engine piston landplane.

Undercarriage is not part of the row, and this family shows why. A-759 \
approves the 7ECA on floats (item 204(c)) and the 7GCBC on floats or skis \
(items 203(k), 203(l)), so floats and skis are properties of an individual \
airframe, not of the designator.
"""

[designators.CH7B]
models = "Citabria 7GCAA, 7GCBC and 7KCAB series"
airframe = "landplane"
engines = 1
engine-type = "piston"
sources = ["faa-A-759"]
checked-against = ["faa-A-759"]
notes = """
TCDS A-759 XIX and XX: Lycoming O-320-A2B/C2B/A2D; XXI: Lycoming IO-320-E2A \
or AEIO-320-E2B. One reciprocating engine throughout. See CH7A on the split.
"""

[designators.DUOD]
models = "Schempp-Hirth Duo Discus T"
airframe = "glider"
engines = 1
engine-type = "piston"
sources = ["easa-A025"]
notes = """
The self-launching variant, not the plain Duo Discus, for the same reason as \
AS21, fitted with a Solo 2350D sustainer engine. Neither the identification \
of this designator with the Duo Discus T nor the facts are sourced yet: no \
source for the identification is named, and the data sheet cited has not \
been read.
"""

[designators.DUOD.source-notes]
easa-A025 = """
Not yet confirmed whether the self-launch conversion (Solo 2350D sustainer) \
is covered by this sheet directly, or by EASA.A.074, a separate reference \
found for the powered variant's noise/STC documentation.
"""

[designators.GLID]
models = "Glider or sailplane, any manufacturer"
airframe = "glider"
engines = 0
engine-type = "none"
sources = ["skybrary-aircraft-type-designator"]
notes = """
The generic designator for a glider with no designator of its own. It is \
not tied to any one manufacturer's type certificate, so there is no type \
certificate data sheet to cite, and the row stays provisional.

Which gliders are filed as GLID rather than under a designator of their own \
is this table's working rule, not something its source states: a designator \
of its own seems to be kept for a type that needs one for ATC and flight \
plan purposes, in practice the self-launching variants (AS21, DUOD).
"""

[designators.LS4]
models = "Rolladen-Schneider LS4"
airframe = "glider"
engines = 0
engine-type = "none"
sources = ["lba-345"]
notes = """
Single-seat glider. No self-launching LS4 variant is known to exist (unlike \
AS21 and DUOD). Whether LS4 is a designator of its own for this type, \
rather than it being filed as the generic GLID, is unconfirmed: it may \
belong under GLID rather than in a row of its own. Kept as its own row \
because it is the designator a pilot's logbook uses for it; revisit when a \
source settles it either way.
"""

[designators.LS4.source-notes]
lba-345 = """
Whether LS4 is even a designator of its own for this type, rather than the \
generic GLID, is also unconfirmed: see the LS4 and GLID rows' notes.
"""

[designators.P28A]
models = "Piper PA-28, fixed-gear family (Cherokee, Warrior, Archer), fixed-pitch propeller"
airframe = "landplane"
engines = 1
engine-type = "piston"
sources = ["faa-2A13"]
notes = """
TC 2A13 spans PA-28-140 through PA-28-236. "PA28" itself is not a current \
designator: it was retired around 1998 and split into P28A, P28B, P28R, P28T \
and P28U (see PA28 under not-to-be-used), so this row is keyed P28A, not PA28.

The split between fixed and retractable gear is made by the designators \
themselves, between this row and P28R; this table does not infer it.
"""

[designators.P28R]
models = "Piper PA-28R Arrow, retractable gear (PA-28R-180, -200, -201 and others)"
airframe = "landplane"
engines = 1
engine-type = "piston"
sources = ["faa-2A13"]
notes = "Same TC 2A13 as P28A."

[designators.PA25]
models = "Piper PA-25 Pawnee"
airframe = "landplane"
engines = 1
engine-type = "piston"
sources = ["manufacturer-model"]
notes = """
Tailwheel; undercarriage is per airframe, and so not part of the row.

Still provisional: the Pawnee's TCDS could not be obtained. It is not 1A11, \
a plausible-looking guess that turns out to be wrong: the Pawnee is \
certificated in the restricted category under a different sheet. Confirm the \
number before promoting the row.
"""

[designators.PA34]
models = "Piper PA-34 Seneca"
airframe = "landplane"
engines = 2
engine-type = "piston"
sources = ["faa-A7SO"]
checked-against = ["faa-A7SO"]
notes = """
TCDS A7SO I: one Lycoming IO-360-C1E6 and one LIO-360-C1E6 \
(counter-rotating), both reciprocating. Covers PA-34-200, -200T and -220T.
"""

[designators.PA44]
models = "Piper PA-44 Seminole"
airframe = "landplane"
engines = 2
engine-type = "piston"
sources = ["easa-IMA232"]
checked-against = ["easa-IMA232"]
notes = """
EASA IM.A.232 A.III.2 describes it outright: "Twin engine reciprocating, \
all-metal, four-place, unpressurized, low wing aeroplane, retractable \
tricycle landing gear." Engines are Lycoming O-360/LO-360. The EASA sheet is \
used because it states the configuration explicitly; the FAA equivalent is \
A19SO.
"""

[designators.PTS2]
models = "Aerotek/Christen Pitts S-2A"
airframe = "landplane"
engines = 1
engine-type = "piston"
sources = ["faa-pitts-S-2A"]
notes = """
Aerobatic biplane. "Pitts S2A" is a model name, not the designator; this row \
is keyed PTS2.
"""

[designators.R44]
models = "Robinson R44"
airframe = "helicopter"
engines = 1
engine-type = "piston"
sources = ["manufacturer-model"]
notes = """
Still provisional: TC H11NM is the right certificate, but the data sheet \
itself was not obtainable free of a login, so nobody has read it. The \
Lycoming O-540 fitment is manufacturer information.
"""

# --- Designators not to be used ----------------------------------------------
#
# Strings pilots write that are known not to be current designators, each with
# what replaces it, so that a consumer can tell "not known" from "known to be
# wrong" and say why.

[not-to-be-used.PA28]
replaced-by = ["P28A", "P28B", "P28R", "P28T", "P28U"]
notes = """
Retired around 1998 and split by model: P28A (fixed gear, fixed-pitch \
propeller: Cherokee, Warrior, Archer), P28B (fixed gear, variable-pitch \
propeller), P28R (Arrow, retractable gear), and P28T and P28U (Turbo Arrow \
variants). Use the one for the aircraft's model.
"""
