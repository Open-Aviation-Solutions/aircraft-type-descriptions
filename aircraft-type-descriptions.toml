# --- Designators not to be used ----------------------------------------------
#
# Strings pilots write that are known not to be current designators, each with
# what replaces it, so that a consumer can tell "not known" from "known to be
# wrong" and say why.

[not-to-be-used.PA28]
replaced-by = ["P28A", "P28B", "P28R", "P28T", "P28U"]
notes = """
Retired around 1998 and split by model: P28A (fixed gear, fixed-pitch \
propeller: Cherokee, Warrior, Archer), P28B (fixed gear, variable-pitch \
propeller), P28R (Arrow, retractable gear), and P28T and P28U (Turbo Arrow \
variants). Use the one for the aircraft's model.
"""
