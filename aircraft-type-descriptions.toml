# Appendix A gives, by designator, the manufacturers and models, the class
# (fixed-wing landplane, amphibian or seaplane; helicopter; gyroplane;
# powered-lift), the number and type of engines (its T, turboprop or
# turboshaft, is turboprop here) and the ICAO wake turbulence category, which
# paragraph 2-6 sets by maximum certificated take-off weight: light 15,400 lb
# or less, medium more than that and less than 300,000 lb (this table's
# categories are by mass: light is 7,000 kg or less). Where it gives
# Light/Medium (variants in both), a row leaves the category out and its notes
# say why.
[sources.faa-jo-7360-1k]
title = "FAA Order JO 7360.1K, Aircraft Type Designators, Appendix A"
kind = "reference-article"
revision = "issued 10 Apr 2025, effective 12 Jun 2025"
url = "https://www.faa.gov/documentLibrary/media/Order/FAA_Order_JO_7360.1K_Aircraft_Type_Designators.pdf"
notes = """
A US Government work. It files a self-launching glider as a fixed-wing \
aircraft, so its class does not tell a glider from an aeroplane. On where its \
data comes from: "The International Civil Aviation Organization (ICAO) \
provides standard type designators" (2-1); "The FAA will conduct an \
analysis of a new aircraft's characteristics, including wake turbulence" \
(2-2b); "The ICAO provides a WTC for aircraft assigned a type \
designator" (2-6). Even so it is a source in its own right, decided on #3 \
on 25 Oct 2026: a US Government work, published under the FAA's own \
authority with its own analysis (2-2b), so taking its class, engine and WTC \
columns is within the rule on Doc 8643.
"""

