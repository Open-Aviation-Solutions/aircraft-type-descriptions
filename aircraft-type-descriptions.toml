sources = ["easa-A221"]
notes = """
The self-launching variant, not the plain, unpowered ASK 21: it has a \
retractable IAE R50-AA rotary engine (41 kW), hence one piston engine, not \
zero. The plain ASK 21 is not known to have a designator of its own; an \
unpowered glider without one is filed as GLID.

The engine count and type describe the real airframe: an aircraft logged \
under this designator is the motorglider, not the plain trainer. (A \
consumer that reads a glider by its airframe alone, as CASA's Part 61 \
category does, is not affected either way.)
"""

