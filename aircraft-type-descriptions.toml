# --- Designators --------------------------------------------------------------
#
# Undercarriage (tailwheel, retractable gear, floats, skis) is not part of a
# row: it varies between airframes of one type, so it is the consumer's to
# record per aircraft.

[designators.A139]
models = "AgustaWestland and Leonardo AW139 (also AB139 and the military UH-139, HH-139, VH-139 and MH-139)"
airframe = "helicopter"
engines = 2
engine-type = "turboprop"
wake-turbulence-category = "light"
sources = ["casa-aircraft-register", "easa-R006", "faa-jo-7360-1k"]
checked-against = ["easa-R006"]
notes = """
TCDS EASA.R.006 III.2 and III.5 describe two free-turbine turboshaft \
engines (PT6C-67C or -67C1) and a retractable tricycle gear. Its maximum \
take-off mass is 6,400 kg, or 6,800 kg or 7,000 kg with a kit (Note 6): \
within the 7,000 kg that this table's light category allows either way. JO \
7360.1K gives Light; it states the ICAO categories in pounds, light being \
15,400 lb or less (paragraph 2-6, about 6,985 kg), which the 7,000 kg kit \
would just pass. The sheet covers the AB139 and AW139, which it gives as two \
names for one product; the military UH-139, HH-139, VH-139 and MH-139 are \
the order's alone.
"""

[designators.AA5]
